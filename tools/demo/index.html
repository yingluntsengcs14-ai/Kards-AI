<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARDS AI 復盤</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1f1e1c;--muted:#6b6a63;--line:#e3e1da;--soft:#efede7;
  --p1:#2a6fd6;--p1soft:#e8f0fc;--p2:#c8502c;--p2soft:#fbece6;--good:#1f8a5b;--warn:#b7791f;--best:#fff4cc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button:hover{border-color:#bdb9ad}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 8px 0 0}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.group label{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:16px;padding:16px 18px;max-width:1700px;margin:0 auto}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.side{border-radius:10px;padding:10px 12px;margin-bottom:10px}
.side.p1{background:var(--p1soft)} .side.p2{background:var(--p2soft)}
.side .head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.side .who{font-weight:700}
.p1 .who{color:var(--p1)} .p2 .who{color:var(--p2)}
.turn-mark{font-size:12px;color:#fff;border-radius:999px;padding:1px 8px}
.p1 .turn-mark{background:var(--p1)} .p2 .turn-mark{background:var(--p2)}
.hqbar{width:140px;height:10px;border-radius:5px;background:#fff;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.hqbar i{display:block;height:100%}
.p1 .hqbar i{background:var(--p1)} .p2 .hqbar i{background:var(--p2)}
.row{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;align-items:flex-start}
.zone{font-size:12px;color:var(--muted);margin:6px 0 3px}
.card{width:112px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 7px;position:relative;cursor:default}
.card .n{font-weight:600;font-size:13.5px;line-height:1.25}
.card .e{font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:1px;word-break:break-word}
.card .m{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:var(--muted)}
.card .st{font-weight:700;color:var(--ink)}
.card .k{position:absolute;top:-7px;left:-7px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;text-align:center;line-height:20px;padding:0 4px}
.card.new{outline:2px solid var(--warn)}
.front{border:2px dashed #cfccc2;border-radius:10px;padding:8px;margin:8px 0;background:#fbfaf7}
.front .zone{margin-top:0}
.hidden-hand{color:var(--muted);font-size:13px;padding:6px 0}
.tip{position:fixed;max-width:280px;background:var(--ink);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;pointer-events:none;z-index:20;display:none;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:4px 6px;font-size:12px}
td{border-bottom:1px solid var(--soft);padding:5px 6px;vertical-align:middle}
tr.best td{background:var(--best)}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:#f3f1ea}
.bar{height:8px;background:var(--soft);border-radius:4px;width:80px;display:inline-block;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 8px;font-size:14px}
.summary b{font-size:18px}
.actions{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.actions button{text-align:left}
.k-play{border-left:4px solid var(--p1)} .k-attack{border-left:4px solid var(--p2)} .k-move{border-left:4px solid var(--warn)} .k-pass{border-left:4px solid var(--muted)} .k-ability{border-left:4px solid var(--good)}
.timeline{max-height:360px;overflow:auto;font-size:13.5px}
.tl{padding:5px 8px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
.tl:hover{background:var(--soft)}
.tl.cur{background:var(--best)}
.tl.p1{border-left-color:var(--p1)} .tl.p2{border-left-color:var(--p2)}
.tl .fx{color:var(--muted);font-size:12px}
.tl.future{opacity:.45}
.navbtns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.banner{padding:8px 12px;border-radius:8px;background:var(--best);margin-bottom:10px;font-weight:600}
.err{color:#b42318;font-size:13px;margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)} .small{font-size:12px}
.busy{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>KARDS AI 復盤</h1>
  <div class="group"><label>P1 牌組</label><select id="d1"></select><label>P2 牌組</label><select id="d2"></select>
    <label>種子</label><input id="seed" type="number" value="1" style="width:80px">
    <button class="primary" onclick="newGame()">開新局</button></div>
  <div class="group"><label>P1 控制</label><select id="c1"></select><label>P2 控制</label><select id="c2"></select></div>
  <div class="group"><label>分析用 AI</label><select id="ai"></select><label>模擬次數</label>
    <select id="sims"><option>32</option><option selected>64</option><option>128</option><option>256</option></select></div>
  <div class="group"><label><input type="checkbox" id="hide"> 隱藏對手手牌（以 P1 視角）</label>
    <label><input type="checkbox" id="auto" checked> 每步自動分析</label></div>
  <div class="group"><button onclick="saveRecord()">存紀錄</button><button onclick="document.getElementById('file').click()">載入紀錄</button>
    <input type="file" id="file" accept=".json" style="display:none" onchange="loadRecord(this)"></div>
</header>
<main>
  <section>
    <div id="banner"></div>
    <div id="board" class="panel"><span class="muted">選好雙方牌組後按「開新局」。</span></div>
  </section>
  <section>
    <div class="panel" style="margin-bottom:12px">
      <h2>AI 建議 <span id="aiwho" class="tag"></span></h2>
      <div class="navbtns">
        <button onclick="analyse()">分析目前局面</button>
        <button onclick="followBest()" id="followBtn" disabled>照 AI 建議走</button>
        <button onclick="aiStep(false)">AI 走一步</button>
        <button onclick="aiStep(true)">AI 走完這回合</button>
        <button onclick="autoPlay()" id="autoBtn">自動對打到結束</button>
      </div>
      <div id="analysis" class="muted small">按「分析目前局面」，看 AI 對每個合法動作的評估。</div>
      <div id="err" class="err"></div>
    </div>
    <div class="panel" style="margin-bottom:12px">
      <h2>合法動作 <span class="tag" id="legalCount"></span><span class="muted small">點一下＝手動走這一步（可用來模擬對手）</span></h2>
      <div id="legal" class="actions"></div>
    </div>
    <div class="panel">
      <h2>時間軸 <span class="muted small">點任一步回到那時的局面；在那裡改走別的動作就是分支</span></h2>
      <div class="navbtns"><button onclick="nav(-1)">◀ 上一步</button><button onclick="nav(1)" id="fwd">下一步 ▶（照紀錄）</button>
        <button onclick="navTurn(-1)">⏮ 上回合</button><button onclick="navTurn(1)">下回合 ⏭</button></div>
      <div id="timeline" class="timeline"></div>
    </div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
let META=null, VIEW=null, ANALYSIS=null, MAINLINE=null, STOP=false;
const $=id=>document.getElementById(id);
const pct=x=>x==null?'—':(x*100).toFixed(0)+'%';

async function api(path, body={}){
  body.hide=$('hide').checked?'p2':null;
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(d.error) throw new Error(d.error); return d;
}
function busy(on){document.body.classList.toggle('busy',on)}
async function guard(fn){$('err').textContent='';busy(true);try{await fn()}catch(e){$('err').textContent=e.message}finally{busy(false)}}

async function init(){
  META=await api('/api/meta');
  for(const id of ['d1','d2']) $(id).innerHTML=META.decks.map(d=>`<option value="${d.name}">${d.name}（${d.nation}${d.ally?'＋'+d.ally:''}）</option>`).join('');
  $('d2').selectedIndex=1;
  const ctrl=`<option value="human">人工操作</option>`+Object.entries(META.ais).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  $('c1').innerHTML=ctrl; $('c2').innerHTML=ctrl; $('c2').value='human';
  $('ai').innerHTML=Object.entries(META.ais).filter(([k])=>k!=='rule').map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  $('ai').value=META.ais.net_mcts?'heuristic_mcts':'heuristic_mcts';
  $('hide').onchange=()=>guard(async()=>render(await api('/api/view')));
}
async function newGame(){await guard(async()=>{MAINLINE=null;ANALYSIS=null;render(await api('/api/new',{p1:$('d1').value,p2:$('d2').value,seed:+$('seed').value}));await afterMove();})}

function cardBox(c, unit){
  const stats = unit ? `<span class="st">${c.atk}/${c.def}</span>` : (c.attack!=null?`<span>${c.attack}/${c.defense}</span>`:`<span>${c.type}</span>`);
  const tip = `${c.zh}（${c.en}）\n${c.nation}・${c.type}・${c.kredits??'?'} K${c.attack!=null?`・${c.attack}/${c.defense}`:''}\n${c.text||''}`;
  const isNew = unit && c.status && c.status.deployed_this_turn;
  return `<div class="card${isNew?' new':''}" data-tip="${tip.replace(/"/g,'&quot;')}">${c.kredits!=null?`<span class="k">${c.kredits}</span>`:''}
    <div class="n">${c.zh}</div><div class="e">${c.en}</div><div class="m"><span>${unit?c.type:c.type}</span>${stats}</div></div>`;
}
function sideBox(pid){
  const p=VIEW.players[pid], cur=VIEW.current===pid && !VIEW.outcome;
  const sup=p.units.filter(u=>u.position!=='frontline').map(u=>cardBox(u,true)).join('')||'<span class="muted small">（空）</span>';
  const hand=p.hand.length?p.hand.map(c=>cardBox(c,false)).join(''):`<div class="hidden-hand">手牌 ${p.hand_count} 張（已隱藏）</div>`;
  const hq=Math.max(0,p.hq);
  const head=`<div class="head"><span class="who">${p.label}</span>${cur?'<span class="turn-mark">輪到這方</span>':''}
    <span>總部 <b>${p.hq}</b>/${p.hq_max}<span class="hqbar"><i style="width:${100*hq/p.hq_max}%"></i></span></span>
    <span>指揮點 <b>${p.kredits}</b>/${p.max_kredits}</span><span class="muted">手牌 ${p.hand_count}・牌庫 ${p.deck_left}${p.countermeasures?`・反制 ${p.countermeasures}`:''}</span>
    <span class="muted small" title="人工盤面評分（-1～1，這一方的觀點）">盤面評分 ${p.heuristic>0?'+':''}${p.heuristic}</span></div>`;
  const handBlock=`<div class="zone">手牌</div><div class="row">${hand}</div>`;
  const supBlock=`<div class="zone">支援線</div><div class="row">${sup}</div>`;
  return `<div class="side ${pid}">${head}${pid==='p2'?handBlock+supBlock:supBlock+handBlock}</div>`;
}
function render(v){
  VIEW=v;
  const front=['p2','p1'].flatMap(pid=>VIEW.players[pid].units.filter(u=>u.position==='frontline').map(u=>({u,pid})));
  const owner=front.length?VIEW.players[front[0].pid].label:'無人控制';
  $('board').innerHTML=`<div class="muted small" style="margin-bottom:6px">第 ${v.turn} 回合・第 ${v.step} 步・種子 ${v.seed}</div>`+sideBox('p2')+
    `<div class="front"><div class="zone">前線（目前：${owner}）</div><div class="row">${front.map(x=>cardBox(x.u,true)).join('')||'<span class="muted small">（空）</span>'}</div></div>`+sideBox('p1');
  $('banner').innerHTML=v.outcome?`<div class="banner">對局結束：${v.outcome}</div>`:'';
  $('legalCount').textContent=v.legal.length+' 個';
  $('legal').innerHTML=v.legal.map(a=>`<button class="k-${a.kind}" onclick="play(${a.index})">${a.text}</button>`).join('')||'<span class="muted small">沒有可走的動作</span>';
  renderTimeline();
  if(!ANALYSIS) {$('analysis').innerHTML='<span class="muted small">按「分析目前局面」，看 AI 對每個合法動作的評估。</span>'; $('followBtn').disabled=true;}
}
function renderTimeline(){
  const h=VIEW.history, ml=MAINLINE, n=VIEW.step;
  let html=`<div class="tl ${n===0?'cur':''}" onclick="goto(0)">開局</div>`;
  h.forEach((s,i)=>{html+=`<div class="tl ${s.player} ${i+1===n?'cur':''}" onclick="goto(${i+1})"><b>${i+1}.</b> 第 ${s.turn} 回合 ${s.label}：${s.action} <span class="tag">${s.by}</span>${s.effects.length?`<div class="fx">${s.effects.join('；')}</div>`:''}</div>`});
  if(ml && ml.history.length>n && isPrefix()) ml.history.slice(n).forEach((s,j)=>{html+=`<div class="tl ${s.player} future" onclick="forwardTo(${n+j+1})"><b>${n+j+1}.</b> 第 ${s.turn} 回合 ${s.label}：${s.action} <span class="tag">${s.by}</span></div>`});
  $('timeline').innerHTML=html;
  const cur=$('timeline').querySelector('.cur'); if(cur) cur.scrollIntoView({block:'nearest'});
  $('fwd').disabled=!(ml && isPrefix() && ml.history.length>n);
}
function isPrefix(){const a=VIEW.history,b=MAINLINE.history;return a.length<=b.length && a.every((s,i)=>s.index===b[i].index)}
function remember(){ if(!MAINLINE || !isPrefix() || VIEW.history.length>MAINLINE.history.length) MAINLINE={history:VIEW.history.slice()}; }

async function play(index,by){await guard(async()=>{ANALYSIS=null;render(await api('/api/play',{index,by:by||'手動'}));remember();await afterMove();})}
async function goto(step){await guard(async()=>{remember();ANALYSIS=null;render(await api('/api/goto',{step}));if($('auto').checked&&!VIEW.outcome)await analyse(true);})}
async function forwardTo(step){await guard(async()=>{ANALYSIS=null;let v=VIEW;while(v.step<step){v=await api('/api/play',{index:MAINLINE.history[v.step].index,by:MAINLINE.history[v.step].by})}render(v);if($('auto').checked&&!VIEW.outcome)await analyse(true);})}
async function nav(d){ if(d<0){ if(VIEW.step>0) await goto(VIEW.step-1);} else if(MAINLINE&&isPrefix()&&MAINLINE.history.length>VIEW.step) await forwardTo(VIEW.step+1); }
async function navTurn(d){
  const all=(MAINLINE&&isPrefix())?MAINLINE.history:VIEW.history, n=VIEW.step, turnOf=i=>i===0?0:all[i-1].turn;
  if(d<0){let i=n-1;while(i>0&&turnOf(i)===turnOf(n))i--; while(i>0&&turnOf(i-1)===turnOf(i))i--; await goto(Math.max(0,i));}
  else{let i=n;while(i<all.length&&all[i].turn===(all[n]||{}).turn)i++; if(i>n) await forwardTo(Math.min(i,all.length));}
}
async function afterMove(){ if(VIEW && !VIEW.outcome && $('auto').checked) await analyse(true); }
async function analyse(inner){
  const run=async()=>{
    if(!VIEW||VIEW.outcome) return;
    $('analysis').innerHTML='<span class="muted small">搜尋中…</span>';
    ANALYSIS=await api('/api/analyse',{ai:$('ai').value,simulations:+$('sims').value});
    renderAnalysis();
  };
  inner?await run():await guard(run);
}
function renderAnalysis(){
  const a=ANALYSIS, s=a.summary||{}; $('aiwho').textContent=(s.ai||'')+(s.simulations?`・${s.simulations} 次模擬`:'');
  const hasV=a.rows.some(r=>r.visits!=null), hasW=a.rows.some(r=>r.winrate!=null), hasP=a.rows.some(r=>r.prior!=null);
  const best=a.rows.find(r=>r.index===a.best);
  let html=`<div class="summary"><span>${s.player||''} 的建議：<b>${best?best.text:'—'}</b></span>${s.winrate!=null?`<span>目前評估 <b>${pct(s.winrate)}</b></span>`:''}<span class="muted small">${s.seconds}s</span></div>`;
  html+=`<table><tr><th>動作</th>${hasV?'<th>搜尋佔比</th>':''}${hasW?'<th class="num" title="搜尋後這一步的平均局面評估，換算成 0～100%（50%＝均勢）。網路版本接近勝率，人工評分版本只適合互相比較。">走這步後評估</th>':''}${hasP?'<th class="num" title="網路（或人工評分）一開始給的機率">先驗</th>':''}<th class="num" title="走完這一步後的人工盤面評分（-1～1）">盤面評分</th></tr>`;
  a.rows.slice(0,15).forEach(r=>{html+=`<tr class="clickable ${r.index===a.best?'best':''}" onclick="play(${r.index},'手動（依分析表）')"><td>${r.text}</td>
    ${hasV?`<td><span class="bar"><i style="width:${(r.visits||0)*100}%"></i></span> <span class="small">${pct(r.visits)}</span></td>`:''}
    ${hasW?`<td class="num">${pct(r.winrate)}</td>`:''}${hasP?`<td class="num">${r.prior==null?'—':pct(r.prior)}</td>`:''}
    <td class="num">${r.heuristic==null?'—':(r.heuristic>0?'+':'')+r.heuristic.toFixed(2)}</td></tr>`});
  if(a.rows.length>15) html+=`<tr><td colspan="5" class="muted small">另有 ${a.rows.length-15} 個動作（評分較低）</td></tr>`;
  html+='</table>'; $('analysis').innerHTML=html; $('followBtn').disabled=a.best==null;
}
async function followBest(){ if(ANALYSIS&&ANALYSIS.best!=null) await play(ANALYSIS.best,($('ai').selectedOptions[0]||{}).text||'AI'); }
function moverAI(){const c=$(VIEW.current==='p1'?'c1':'c2').value;return c==='human'?$('ai').value:c}
async function aiStep(untilTurnEnd){await guard(async()=>{ANALYSIS=null;render(await api('/api/ai_step',{ai:moverAI(),until_turn_end:untilTurnEnd,simulations:+$('sims').value}));remember();if($('auto').checked&&!VIEW.outcome)await analyse(true);})}
async function autoPlay(){
  if($('autoBtn').dataset.on){STOP=true;return}
  $('autoBtn').dataset.on='1';$('autoBtn').textContent='停止';STOP=false;$('err').textContent='';
  try{ while(VIEW&&!VIEW.outcome&&!STOP){
      const c=$(VIEW.current==='p1'?'c1':'c2').value; if(c==='human') break;
      ANALYSIS=null; render(await api('/api/ai_step',{ai:c,until_turn_end:true,simulations:+$('sims').value})); remember(); }
    if(VIEW&&!VIEW.outcome&&$('auto').checked) await analyse(true);
  }catch(e){$('err').textContent=e.message}
  delete $('autoBtn').dataset.on;$('autoBtn').textContent='自動對打到結束';
}
async function saveRecord(){await guard(async()=>{const r=await api('/api/record');const blob=new Blob([JSON.stringify(r,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kards_${r.decks.join('_vs_')}_seed${r.seed}.json`;a.click();})}
async function loadRecord(input){const f=input.files[0];if(!f)return;const record=JSON.parse(await f.text());input.value='';
  await guard(async()=>{const v=await api('/api/load',{record});MAINLINE={history:v.history.slice()};ANALYSIS=null;render(await api('/api/goto',{step:0}));});}
// tooltip
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]'),tip=$('tip');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+14)+'px'});
init().catch(e=>{$('err').textContent=e.message});
</script>
</body>
</html>
