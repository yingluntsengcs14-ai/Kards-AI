self_play:
  episodes_per_cycle: 1000
  workers: 16
  simulations: 16
  async_mcts: true
  shared_memory: true
  max_pending_leaves: 8
  max_actions: 300
  # Self-play draws both sides' decks from the 17 confirmed tournament/meta
  # decks (data/decks/meta_decks.json), not random nation decks -- the model
  # should learn against the actual competitive card pool and ratios.
  meta_decks: true
  # Kept only as the deck_pool evaluate.py/fair_evaluate.py use for the
  # external random-opponent fairness benchmark below; self-play itself
  # ignores this list while meta_decks is true.
  deck_pool:
    - {main: Britain, ally: France}
    - {main: Britain, ally: Poland}
    - {main: Germany, ally: Italy}
    - {main: Germany, ally: Finland}
    - {main: USA, ally: Britain}
    - {main: Soviet, ally: Poland}
    - {main: Britain, ally: Germany}
    - {main: Britain, ally: USA}
    - {main: Britain, ally: Soviet}
    - {main: Britain, ally: Japan}
    - {main: Britain, ally: Italy}
    - {main: Britain, ally: Finland}
    - {main: Germany, ally: Britain}
    - {main: Germany, ally: USA}
    - {main: Germany, ally: Soviet}
    - {main: Germany, ally: Japan}
    - {main: Germany, ally: France}
    - {main: Germany, ally: Poland}
    - {main: USA, ally: Germany}
    - {main: USA, ally: Soviet}
    - {main: USA, ally: Japan}
    - {main: USA, ally: France}
    - {main: USA, ally: Italy}
    - {main: USA, ally: Poland}
    - {main: USA, ally: Finland}
    - {main: Soviet, ally: Britain}
    - {main: Soviet, ally: Germany}
    - {main: Soviet, ally: USA}
    - {main: Soviet, ally: Japan}
    - {main: Soviet, ally: France}
    - {main: Soviet, ally: Italy}
    - {main: Soviet, ally: Finland}
    - {main: Japan, ally: Britain}
    - {main: Japan, ally: Germany}
    - {main: Japan, ally: USA}
    - {main: Japan, ally: Soviet}
    - {main: Japan, ally: France}
    - {main: Japan, ally: Italy}
    - {main: Japan, ally: Poland}
    - {main: Japan, ally: Finland}
  replay_capacity: 250000
  replay_recent_fraction: 0.6
model:
  hidden_dim: 128
training:
  batch_size: 64
  learning_rate: 0.0001
  min_learning_rate: 0.00003
  lr_decay_every_steps: 1000
  lr_decay: 0.9
  # Mature candidates were consistently overstepping the external gate after
  # 800 updates.  Use a smaller policy-iteration step while preserving the
  # same replay distribution and learning-rate schedule.
  updates_per_cycle: 500
checkpoint:
  keep_last: 10
  interval_cycles: 1
evaluation:
  seed: 20260730
  interval_games: 10000
  games_per_opponent: 100
  champion_games: 100
  promotion_win_rate: 0.55
  external_tolerance: 0.0
  opponents: [random, rule]
  fair_benchmark:
    games: 500
    simulations: 16
    seed: 20260727
    nations: [Britain, France, Germany, Japan, Soviet, USA]
logging:
  metrics_path: training_metrics.jsonl
  replay_path: replay.pkl
  latest_checkpoint: latest.pt
  history_dir: checkpoints
  evaluation_history: evaluation_history.jsonl
