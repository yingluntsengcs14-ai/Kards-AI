self_play:
  # Was 1000 -- at the measured 4.236 sec/game (workers=1, 16 simulations,
  # meta-decks; see claude 專案文件 claude/訓練工作流.md 0.5), that is ~70
  # minutes of self-play alone per cycle, not the ~40-45 min/cycle the 0.5
  # benchmark note originally estimated (that estimate used 200 episodes).
  # Lowered to 300 (~21 min of self-play/cycle) on 2026-11-18 so cycles turn
  # over faster during the 11/17-11/30 main training window and there is
  # more frequent learning-curve/report feedback -- raise this back up if
  # per-cycle wall-clock stops mattering more than sample count.
  episodes_per_cycle: 300
  # Measured on the actual training desktop (i3-13100 + GTX 1070 Ti,
  # 2026-11-03, see claude 專案文件 claude/訓練工作流.md 0.5): workers=4 was
  # 41% SLOWER than workers=1 -- a single GTX 1070 Ti's inference is the
  # bottleneck, so extra self-play worker processes just contend for the same
  # CUDA context/queue instead of parallelising. Do not raise this without
  # re-measuring on that machine; this was previously 16, left over from an
  # estimate for stronger hardware before the benchmark existed.
  workers: 1
  # 2026-11-22: 16 -> 32. With 16 simulations over 20+ legal actions the
  # visit counts barely differ from the network's own prior, so the policy
  # target taught it little beyond itself. Roughly doubles self-play time.
  simulations: 32
  # perfect = ordinary MCTS on the real GameState (sees both hands -- a
  # "cheating" search whose strength does not transfer to a real opponent);
  # pimc = PIMCAgent, an honest hidden-information search (see ai/pimc.py
  # and selfplay.py's --search/--pimc-worlds). Only workers: 1 supports pimc.
  search: perfect
  pimc_worlds: 4
  async_mcts: true
  shared_memory: true
  max_pending_leaves: 8
  max_actions: 300
  # Self-play draws both sides' decks from the 17 confirmed tournament/meta
  # decks (data/decks/meta_decks.json), not random nation decks -- the model
  # should learn against the actual competitive card pool and ratios.
  meta_decks: true
  # Kept only as the deck_pool evaluate.py/fair_evaluate.py use for the
  # external random-opponent fairness benchmark below; self-play itself
  # ignores this list while meta_decks is true.
  deck_pool:
    - {main: Britain, ally: France}
    - {main: Britain, ally: Poland}
    - {main: Germany, ally: Italy}
    - {main: Germany, ally: Finland}
    - {main: USA, ally: Britain}
    - {main: Soviet, ally: Poland}
    - {main: Britain, ally: Germany}
    - {main: Britain, ally: USA}
    - {main: Britain, ally: Soviet}
    - {main: Britain, ally: Japan}
    - {main: Britain, ally: Italy}
    - {main: Britain, ally: Finland}
    - {main: Germany, ally: Britain}
    - {main: Germany, ally: USA}
    - {main: Germany, ally: Soviet}
    - {main: Germany, ally: Japan}
    - {main: Germany, ally: France}
    - {main: Germany, ally: Poland}
    - {main: USA, ally: Germany}
    - {main: USA, ally: Soviet}
    - {main: USA, ally: Japan}
    - {main: USA, ally: France}
    - {main: USA, ally: Italy}
    - {main: USA, ally: Poland}
    - {main: USA, ally: Finland}
    - {main: Soviet, ally: Britain}
    - {main: Soviet, ally: Germany}
    - {main: Soviet, ally: USA}
    - {main: Soviet, ally: Japan}
    - {main: Soviet, ally: France}
    - {main: Soviet, ally: Italy}
    - {main: Soviet, ally: Finland}
    - {main: Japan, ally: Britain}
    - {main: Japan, ally: Germany}
    - {main: Japan, ally: USA}
    - {main: Japan, ally: Soviet}
    - {main: Japan, ally: France}
    - {main: Japan, ally: Italy}
    - {main: Japan, ally: Poland}
    - {main: Japan, ally: Finland}
  replay_capacity: 250000
  replay_recent_fraction: 0.6
model:
  hidden_dim: 128
training:
  batch_size: 64
  learning_rate: 0.0001
  min_learning_rate: 0.00003
  lr_decay_every_steps: 1000
  lr_decay: 0.9
  # Mature candidates were consistently overstepping the external gate after
  # 800 updates.  Use a smaller policy-iteration step while preserving the
  # same replay distribution and learning-rate schedule.
  updates_per_cycle: 500
checkpoint:
  keep_last: 10
  interval_cycles: 1
evaluation:
  seed: 20260730
  interval_games: 10000
  games_per_opponent: 100
  champion_games: 100
  # 2026-11-21: lowered from 0.55/0.0 after champion sat frozen for 52 straight
  # cycles (2+ days) -- self-play always generates its training data from
  # `champion.pt` (see auto_train.py's selfplay_args), so a champion that never
  # promotes means every later cycle keeps training on data produced by the
  # same stale policy, which in turn keeps failing to clear the old gate: a
  # self-reinforcing stall, not just slow progress.
  #
  # First attempt (external_tolerance: 0.05) was still not enough: 12 more
  # cycles (29-40) after the config change confirmed candidates regularly
  # clear the head-to-head bar (e.g. cycle 32's gate win_rate was exactly
  # 0.52) but still fail the external gate, because candidates' win rate vs
  # the plain `random` opponent (51-74% across these cycles) has drifted well
  # below the frozen champion's 87% vs random -- a 15-35 point gap, not the
  # 5 points this tolerance allowed for. That drift is itself a real finding
  # worth keeping for the report (self-play co-adapting to one fixed opponent
  # generalizes worse to an unrelated baseline like random play), but letting
  # it permanently block promotion defeats the point of relaxing the gate.
  # Raised external_tolerance to 0.2 so promotion is now driven mainly by the
  # head-to-head result, with the external check only catching a candidate
  # that regresses far more than anything observed so far.
  #
  # 2026-11-22: 0.2 measured against the *current* Champion let it slide
  # down promotion by promotion (87%/57% -> 50%/34% vs random/rule over 80
  # cycles). auto_train.py now anchors this check to the best external
  # scores ever recorded, so 0.1 is a fixed floor, not a ratchet.
  promotion_win_rate: 0.52
  external_tolerance: 0.1
  opponents: [random, rule]
  fair_benchmark:
    games: 500
    simulations: 16
    seed: 20260727
    nations: [Britain, France, Germany, Japan, Soviet, USA]
logging:
  metrics_path: training_metrics.jsonl
  replay_path: replay.pkl
  latest_checkpoint: latest.pt
  history_dir: checkpoints
  evaluation_history: evaluation_history.jsonl
